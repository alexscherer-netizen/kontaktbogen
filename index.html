<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kontaktbogen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* ============================================================
   Tokens
   ============================================================ */
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --sunken:#F2F0EB; --raised:#FFFFFF;
  --line:#E6E2DA; --line-2:#D1CBBF; --line-3:#B8B1A2;
  --ink:#191813; --ink-2:#59554B; --ink-3:#8B8578;
  --accent:#12504E; --accent-hi:#0C3B39; --accent-tint:#E3EEEB; --on-accent:#FFFFFF;
  --ok:#2E6B4F; --ok-tint:#E5F0E9;
  --warn:#96660F; --warn-tint:#F6EEDC;
  --crit:#9B342C; --crit-tint:#F7E9E6;
  --shadow-1:0 1px 2px rgba(25,24,19,.05);
  --shadow-2:0 12px 32px -20px rgba(25,24,19,.45), 0 1px 2px rgba(25,24,19,.06);
  --r:7px; --r-sm:5px;
  /* Eine Leiter statt verstreuter Pixelwerte — auf dem Handy rueckt sie hoch. */
  --fs-xs:11px; --fs-sm:12.5px; --fs-md:13.5px; --fs-lg:15px; --fs-xl:17px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121310; --surface:#1A1C18; --sunken:#16180F; --raised:#20231E;
    --line:#2B2E27; --line-2:#3B3F36; --line-3:#4E5347;
    --ink:#EDEBE4; --ink-2:#A9A599; --ink-3:#7D786B;
    --accent:#6FC0B4; --accent-hi:#8FD4C9; --accent-tint:#16332F; --on-accent:#0B1F1D;
    --ok:#63B98C; --ok-tint:#16281F;
    --warn:#D3A249; --warn-tint:#2C2415;
    --crit:#DE8177; --crit-tint:#2E1A17;
    --shadow-1:0 1px 2px rgba(0,0,0,.5);
    --shadow-2:0 16px 40px -24px #000, 0 1px 2px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121310; --surface:#1A1C18; --sunken:#16180F; --raised:#20231E;
  --line:#2B2E27; --line-2:#3B3F36; --line-3:#4E5347;
  --ink:#EDEBE4; --ink-2:#A9A599; --ink-3:#7D786B;
  --accent:#6FC0B4; --accent-hi:#8FD4C9; --accent-tint:#16332F; --on-accent:#0B1F1D;
  --ok:#63B98C; --ok-tint:#16281F;
  --warn:#D3A249; --warn-tint:#2C2415;
  --crit:#DE8177; --crit-tint:#2E1A17;
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 16px 40px -24px #000, 0 1px 2px rgba(0,0,0,.6);
  color-scheme:dark;
}

/* ============================================================
   Grundlagen
   ============================================================ */
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  font-size:var(--fs-md); line-height:1.5; -webkit-font-smoothing:antialiased;
  font-feature-settings:"ss01" on;
  overflow-wrap:break-word;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0; font-weight:600; text-wrap:balance; letter-spacing:-.012em}
p{margin:0}
button,input,textarea,select{font:inherit; color:inherit}
a{color:var(--accent); text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
::selection{background:var(--accent-tint)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.serif{font-family:"Source Serif 4",Georgia,serif}
.mono{font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.lab{
  font-family:"DM Mono",monospace; font-size:var(--fs-xs); font-weight:500;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
}
.trunc{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ============================================================
   App-Rahmen
   ============================================================ */
.app{display:grid; grid-template-columns:272px minmax(0,1fr); min-height:100vh}
@media (max-width:980px){.app{grid-template-columns:1fr}}

.rail{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:100vh;
  position:sticky; top:0; max-height:100vh;
}
@media (max-width:980px){.rail{position:static; min-height:0; max-height:none; border-right:none; border-bottom:1px solid var(--line)}}

.mark{display:flex; align-items:center; gap:10px; padding:16px 18px 14px}
.mark .glyph{
  width:26px; height:26px; border:1px solid var(--ink); border-radius:2px; flex:none;
  display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; overflow:hidden;
}
.mark .glyph i{display:block; background:var(--ink); opacity:.14}
.mark .glyph i:nth-child(2){opacity:.45}
.mark .glyph i:nth-child(3){background:var(--accent); opacity:1}
.mark .glyph i:nth-child(4){opacity:.26}
.mark .name{font-weight:600; letter-spacing:-.02em; font-size:var(--fs-lg); line-height:1.1}
.mark .sub{font-size:var(--fs-xs); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-family:"DM Mono",monospace}

.rail-tools{padding:0 14px 12px; display:flex; flex-direction:column; gap:8px}
.rail-scroll{overflow-y:auto; padding:0 8px 16px; flex:1; min-height:0}
.rail-foot{border-top:1px solid var(--line); padding:10px 14px; display:flex; align-items:center; gap:8px}
.rail-foot .who{flex:1; min-width:0; font-size:var(--fs-sm); color:var(--ink-3)}

.group-head{
  display:flex; align-items:center; gap:8px; padding:14px 8px 6px;
}
.group-head .lab{white-space:nowrap}
.group-head .rule{flex:1; height:1px; background:var(--line)}

/* Planungseintrag */
.entry{
  width:100%; display:grid; grid-template-columns:38px minmax(0,1fr); gap:11px;
  text-align:left; background:transparent; border:none; cursor:pointer;
  padding:9px 10px; border-radius:var(--r); align-items:start;
}
.entry:hover{background:var(--sunken)}
.entry.on{background:var(--sunken)}
.entry.on .e-title{color:var(--ink)}
.e-date{
  border:1px solid var(--line-2); border-radius:var(--r-sm); padding:3px 0 4px;
  text-align:center; font-family:"DM Mono",monospace; line-height:1.05; background:var(--surface);
}
.e-date b{display:block; font-size:var(--fs-md); font-weight:500; font-variant-numeric:tabular-nums}
.e-date span{display:block; font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-top:2px}
.entry.on .e-date{border-color:var(--accent); color:var(--accent)}
.entry.on .e-date span{color:var(--accent)}
.e-title{font-weight:500; font-size:var(--fs-md); line-height:1.3; display:flex; align-items:center; gap:6px}
.e-title .dot{width:5px; height:5px; border-radius:50%; flex:none}
.e-meta{font-family:"DM Mono",monospace; font-size:var(--fs-xs); color:var(--ink-3); margin-top:3px}

/* ============================================================
   Kopfzeile im Inhalt
   ============================================================ */
.topbar{
  position:sticky; top:0; z-index:20; border-bottom:1px solid var(--line);
  background:var(--bg); background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
}
@supports not (backdrop-filter: blur(2px)){.topbar{background:var(--bg)}}
.topbar-in{display:flex; align-items:center; gap:14px; padding:13px 28px}
@media (max-width:640px){.topbar-in{padding:12px 16px; flex-wrap:wrap}}
.topbar h1{font-size:var(--fs-xl); letter-spacing:-.02em}
.topbar .sp{flex:1}
.crumb{font-family:"DM Mono",monospace; font-size:var(--fs-xs); color:var(--ink-3); letter-spacing:.06em}

.tabs{display:flex; gap:22px; padding:0 28px; border-bottom:1px solid var(--line); overflow-x:auto; background:var(--bg)}
@media (max-width:640px){.tabs{padding:0 16px; gap:16px}}
.tab{
  background:none; border:none; cursor:pointer; padding:11px 0 10px; white-space:nowrap;
  font-size:var(--fs-md); font-weight:500; color:var(--ink-3); border-bottom:1.5px solid transparent;
  margin-bottom:-1px; display:flex; align-items:center; gap:7px;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink); border-bottom-color:var(--accent)}
.tab .cnt{
  font-family:"DM Mono",monospace; font-size:var(--fs-xs); background:var(--sunken); color:var(--ink-3);
  padding:1px 5px; border-radius:4px; font-variant-numeric:tabular-nums;
}
.tab.on .cnt{background:var(--accent-tint); color:var(--accent)}

.content{padding:24px 28px 80px; max-width:1180px}
@media (max-width:640px){.content{padding:18px 16px 60px}}

/* ============================================================
   Bedienelemente
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  padding:7px 13px; border-radius:var(--r-sm); cursor:pointer; font-size:var(--fs-md); font-weight:500;
  box-shadow:var(--shadow-1); transition:background .12s ease, border-color .12s ease;
}
.btn:hover{background:var(--sunken); border-color:var(--line-3)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn-pri{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn-pri:hover{background:var(--accent-hi); border-color:var(--accent-hi)}
.btn-quiet{border-color:transparent; background:transparent; box-shadow:none; color:var(--ink-2)}
.btn-quiet:hover{background:var(--sunken); color:var(--ink)}
.btn-sm{padding:4px 9px; font-size:var(--fs-sm)}
.btn-wide{width:100%}
.btn-danger{color:var(--crit); border-color:var(--line-2)}
.btn-danger:hover{border-color:var(--crit); color:var(--crit); background:var(--crit-tint)}

.inp{
  width:100%; background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-sm);
  padding:7px 10px; color:var(--ink); box-shadow:var(--shadow-1);
}
.inp::placeholder{color:var(--ink-3)}
.inp:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint)}
textarea.inp{resize:vertical; min-height:66px; line-height:1.55}
select.inp{appearance:none; padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%, calc(100% - 9px) 52%;
  background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
}
.inp-sm{padding:4px 8px; font-size:var(--fs-sm); width:auto}
.search{position:relative}
.search .inp{padding-left:28px}
.search svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--ink-3)}

.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field > .lab{margin-bottom:1px}
.row{display:flex; gap:10px; flex-wrap:wrap}
.col{display:flex; flex-direction:column; gap:10px}
.g2{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px}

/* Filterchips */
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  padding:4px 11px; border-radius:100px; font-size:var(--fs-sm); cursor:pointer;
}
.chip:hover{border-color:var(--line-3); color:var(--ink)}
.chip.on{background:var(--ink); border-color:var(--ink); color:var(--bg)}

/* Status */
.st{
  display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-sm); font-weight:500;
  padding:2.5px 9px 2.5px 7px; border-radius:100px; border:1px solid transparent; white-space:nowrap;
}
.st i{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.st-idee{background:var(--sunken); color:var(--ink-2); border-color:var(--line)}
.st-geplant{background:var(--accent-tint); color:var(--accent); border-color:transparent}
.st-bestaetigt{background:var(--ok-tint); color:var(--ok)}
.st-erledigt{background:var(--ok-tint); color:var(--ok)}
.st-erledigt i{border-radius:1px}
.st-verworfen,.st-abgesagt{background:var(--crit-tint); color:var(--crit)}

/* ============================================================
   Flächen
   ============================================================ */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-1)}
.card > .hd{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:13px 16px; border-bottom:1px solid var(--line);
}
.card > .hd h3{font-size:var(--fs-md)}
.card > .bd{padding:16px}
.card > .bd.flush{padding:0}
.cards{display:flex; flex-direction:column; gap:16px}
.split{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(280px,.9fr); gap:16px; align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}

.rows > *{border-top:1px solid var(--line)}
.rows > *:first-child{border-top:none}
.rw{display:flex; gap:12px; padding:11px 16px; align-items:flex-start}
.rw:hover{background:var(--sunken)}

.dl{display:flex; flex-direction:column}
.dl > div{display:flex; align-items:baseline; gap:12px; padding:9px 0; border-top:1px solid var(--line)}
.dl > div:first-child{border-top:none; padding-top:0}
.dl dt{flex:none; width:88px}
.dl dd{margin:0; flex:1; min-width:0; font-size:var(--fs-md)}

.empty{
  padding:30px 20px; text-align:center; color:var(--ink-3); font-size:var(--fs-md);
  border:1px dashed var(--line-2); border-radius:var(--r); background:var(--sunken);
}
.hint{
  font-size:var(--fs-md); color:var(--ink-2); background:var(--sunken);
  border:1px solid var(--line); border-left:2px solid var(--accent);
  padding:10px 13px; border-radius:0 var(--r-sm) var(--r-sm) 0;
}
.hint.bad{border-left-color:var(--crit); color:var(--crit); background:var(--crit-tint)}

/* Fortschritt */
.meter{display:flex; flex-direction:column; gap:6px}
.meter .top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:var(--fs-sm)}
.meter .bar{height:5px; border-radius:100px; background:var(--sunken); overflow:hidden; border:1px solid var(--line)}
.meter .bar i{display:block; height:100%; background:var(--accent); border-radius:100px}
.ringwrap{display:flex; align-items:center; gap:16px}
.ringwrap .big{font-size:26px; font-weight:600; letter-spacing:-.03em; font-variant-numeric:tabular-nums}

/* Zugangscode */
.access{border:1px solid var(--line-2); border-radius:var(--r); overflow:hidden; background:var(--sunken)}
.access .val{
  font-family:"DM Mono",monospace; font-size:23px; letter-spacing:.3em; font-weight:500;
  padding:16px 14px 15px; text-align:center; background:var(--surface); border-bottom:1px solid var(--line);
  user-select:all;
}
.access .acts{display:flex}
.access .acts button{
  flex:1; background:transparent; border:none; border-left:1px solid var(--line); padding:8px 4px;
  font-size:var(--fs-sm); cursor:pointer; color:var(--ink-2);
}
.access .acts button:first-child{border-left:none}
.access .acts button:hover{background:var(--surface); color:var(--ink)}

/* Kontaktbogen / Galerie */
.gal{display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:12px}
.shot{border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; background:var(--sunken); position:relative}
.shot .ph{aspect-ratio:4/3; display:block; width:100%; object-fit:cover; background:var(--sunken)}
.shot .info{padding:8px 10px 9px; border-top:1px solid var(--line); background:var(--surface)}
.shot .info .t{font-size:var(--fs-sm); line-height:1.35; color:var(--ink)}
.shot .info .m{font-family:"DM Mono",monospace; font-size:var(--fs-xs); color:var(--ink-3); margin-top:3px; letter-spacing:.05em}
.shot .rm{
  position:absolute; top:6px; right:6px; background:var(--surface); border:1px solid var(--line-2);
  border-radius:4px; width:22px; height:22px; line-height:1; cursor:pointer; color:var(--ink-2);
  opacity:0; transition:opacity .12s;
}
.shot:hover .rm, .shot:focus-within .rm{opacity:1}
.shot .rm:hover{color:var(--crit); border-color:var(--crit)}
.shot .no{
  position:absolute; top:6px; left:6px; font-family:"DM Mono",monospace; font-size:var(--fs-xs);
  background:rgba(0,0,0,.62); color:#fff; padding:1px 5px; border-radius:3px; letter-spacing:.08em;
}

/* Shotlist-Zeile */
.slot{display:grid; grid-template-columns:26px 54px minmax(0,1fr) auto; gap:12px; padding:12px 16px; align-items:start}
@media (max-width:640px){.slot{grid-template-columns:26px minmax(0,1fr); }.slot .thumb{display:none}}
.slot .idx{font-family:"DM Mono",monospace; font-size:var(--fs-sm); color:var(--ink-3); padding-top:2px; font-variant-numeric:tabular-nums}
.thumb{width:54px; height:40px; object-fit:cover; border-radius:3px; border:1px solid var(--line); background:var(--sunken)}
.slot h4{font-size:var(--fs-md); font-weight:500}
.slot .sub{font-size:var(--fs-md); color:var(--ink-2); margin-top:3px; white-space:pre-wrap}
.tagrow{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
.tag{font-family:"DM Mono",monospace; font-size:var(--fs-xs); color:var(--ink-3); border:1px solid var(--line); border-radius:3px; padding:1px 6px}

/* Checkliste */
.chk{display:flex; gap:11px; padding:10px 16px; align-items:flex-start; cursor:pointer}
.chk input{margin:2px 0 0; width:15px; height:15px; accent-color:var(--accent); flex:none; cursor:pointer}
.chk .t{font-size:var(--fs-md)}
.chk.done .t{color:var(--ink-3); text-decoration:line-through}
.chk[data-locked="1"]{cursor:default}

/* Zeitplan */
.tl{padding:4px 16px 12px}
.tl-row{display:grid; grid-template-columns:96px minmax(0,1fr); gap:16px; position:relative; padding:12px 0 12px 0}
.tl-row::before{content:""; position:absolute; left:96px; top:0; bottom:0; width:1px; background:var(--line)}
.tl-row:first-child::before{top:16px}
.tl-row:last-child::before{bottom:calc(100% - 16px)}
.tl-row .dot{position:absolute; left:93px; top:15px; width:7px; height:7px; border-radius:50%; background:var(--accent); border:2px solid var(--bg)}
.tl-row .tm{font-family:"DM Mono",monospace; font-size:var(--fs-sm); color:var(--ink-2); font-variant-numeric:tabular-nums; text-align:right; padding-top:1px}
.tl-row .bdy{padding-left:16px}

/* Absprachen */
.thread{display:flex; flex-direction:column; gap:14px; padding:16px; max-height:52vh; overflow-y:auto}
.bubble{max-width:min(560px,88%); display:flex; flex-direction:column; gap:4px}
.bubble .who{font-size:var(--fs-xs); color:var(--ink-3)}
.bubble .who b{font-weight:500; color:var(--ink-2)}
.bubble .txt{border:1px solid var(--line); background:var(--surface); border-radius:2px 9px 9px 9px; padding:9px 12px; white-space:pre-wrap; font-size:var(--fs-md)}
.bubble.self{align-self:flex-end; align-items:flex-end}
.bubble.self .txt{background:var(--accent-tint); border-color:transparent; border-radius:9px 2px 9px 9px}
.composer{border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:10px; align-items:flex-end}

/* ============================================================
   Anmeldung
   ============================================================ */
.entrance{min-height:100vh; display:grid; grid-template-columns:1.1fr .9fr}
@media (max-width:900px){.entrance{grid-template-columns:1fr}}
.entrance .left{
  padding:56px 6vw; display:flex; flex-direction:column; justify-content:center; gap:26px;
  border-right:1px solid var(--line); background:var(--surface);
}
@media (max-width:900px){.entrance .left{border-right:none; border-bottom:1px solid var(--line); padding:40px 24px}}
.entrance h1{font-family:"Source Serif 4",Georgia,serif; font-size:clamp(30px,3.8vw,46px); line-height:1.08; letter-spacing:-.025em; font-weight:600}
.entrance .lead{font-size:var(--fs-xl); line-height:1.62; color:var(--ink-2); max-width:44ch}
.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.facts div{background:var(--surface); padding:13px 14px}
.facts b{display:block; font-size:19px; font-weight:600; letter-spacing:-.02em; margin-bottom:2px}
.facts span{font-size:var(--fs-sm); color:var(--ink-3); line-height:1.35; display:block}
.entrance .right{padding:48px 6vw; display:flex; flex-direction:column; justify-content:center; gap:18px}
@media (max-width:900px){.entrance .right{padding:32px 24px 56px}}
.seg{display:flex; border:1px solid var(--line-2); border-radius:var(--r-sm); overflow:hidden; background:var(--sunken)}
.seg button{flex:1; background:transparent; border:none; padding:8px; cursor:pointer; font-size:var(--fs-sm); font-weight:500; color:var(--ink-3)}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-1)}
.codefield{
  font-family:"DM Mono",monospace; font-size:24px; letter-spacing:.34em; text-align:center;
  text-transform:uppercase; padding:14px 8px 14px 16px;
}

/* ============================================================
   Profil
   ============================================================ */
.ava{
  border-radius:50%; object-fit:cover; background:var(--sunken); flex:none;
  border:1px solid var(--line-2); display:grid; place-items:center;
  font-weight:600; color:var(--ink-2); overflow:hidden;
}
.ava-28{width:28px; height:28px; font-size:var(--fs-xs)}
.ava-36{width:36px; height:36px; font-size:var(--fs-md)}
.ava-72{width:72px; height:72px; font-size:24px}
.ava img{width:100%; height:100%; object-fit:cover; display:block}
.me-btn{
  display:flex; align-items:center; gap:9px; flex:1; min-width:0; padding:5px 6px;
  border:1px solid transparent; background:transparent; border-radius:var(--r-sm); cursor:pointer; text-align:left;
}
.me-btn:hover{background:var(--sunken)}
.me-btn .nm{font-size:var(--fs-sm); font-weight:500; line-height:1.2}
.me-btn .rl{font-size:var(--fs-xs); color:var(--ink-3); line-height:1.2}
.member-row{display:flex; align-items:center; gap:10px; padding:10px 16px}
.member-row .nm{font-size:var(--fs-md); font-weight:500}
.member-row .rl{font-size:var(--fs-sm); color:var(--ink-3)}

/* ============================================================
   Freigabe
   ============================================================ */
.sw{
  display:flex; align-items:center; gap:12px; padding:12px 16px; width:100%;
  background:transparent; border:none; text-align:left; color:inherit; cursor:pointer;
}
.sw:hover{background:var(--sunken)}
.sw .txt{flex:1; min-width:0}
.sw .txt b{display:block; font-size:var(--fs-md); font-weight:500}
.sw .txt span{display:block; font-size:var(--fs-sm); color:var(--ink-3); margin-top:1px}
.track{
  width:42px; height:24px; border-radius:100px; background:var(--sunken);
  border:1px solid var(--line-2); position:relative; flex:none;
  transition:background .15s ease, border-color .15s ease;
}
.track::after{
  content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
  background:var(--surface); box-shadow:var(--shadow-1); transition:transform .15s ease;
}
.sw.on .track{background:var(--accent); border-color:var(--accent)}
.sw.on .track::after{transform:translateX(18px)}
.sw:not(.on) .txt b{color:var(--ink-2)}
.sw[disabled]{opacity:.45; cursor:not-allowed}
.sw[disabled]:hover{background:transparent}
@media (max-width:640px){.sw{padding:14px}}
.locked{
  display:grid; place-items:center; min-height:60vh; padding:30px 20px; text-align:center;
}
.locked .box{max-width:420px; display:flex; flex-direction:column; gap:14px; align-items:center}

/* ============================================================
   Karte
   ============================================================ */
.mapwrap{height:340px; width:100%; background:var(--sunken); position:relative}
.mapwrap .leaflet-container{height:100%; width:100%; background:var(--sunken)}
@media (max-width:640px){.mapwrap{height:260px}}
.hits{border-top:1px solid var(--line); margin-top:14px}
.hit{
  display:block; width:100%; text-align:left; background:transparent; border:none;
  border-top:1px solid var(--line); padding:10px 14px; cursor:pointer;
}
.hit:first-of-type{border-top:none}
.hit:hover{background:var(--sunken)}
.hit .t{display:block; font-size:var(--fs-md); line-height:1.45}
.hit .c{display:block; font-size:var(--fs-xs); color:var(--ink-3); margin-top:2px}
.maproutes{display:flex; gap:8px; flex-wrap:wrap; padding:14px 16px}
.mapnote{padding:0 16px 14px; font-size:var(--fs-sm); color:var(--ink-3)}
.distline{
  display:flex; align-items:baseline; gap:10px; padding:12px 16px; border-top:1px solid var(--line);
}
.distline b{font-size:20px; font-weight:600; letter-spacing:-.02em; font-variant-numeric:tabular-nums}

/* ============================================================
   Bereiche
   ============================================================ */
.gsec{display:flex; align-items:center; gap:8px; padding:14px 16px 6px}
.gsec .rule{flex:1; height:1px; background:var(--line)}
.grow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px; padding:10px 16px; align-items:center}
.grow .gname{font-size:var(--fs-md); font-weight:500}
.grow .gsub{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:3px}
.grow.conflict{background:var(--crit-tint)}
.grow.agree{background:var(--ok-tint)}
.stance{display:flex; gap:3px; flex:none}
.stance button{
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2);
  padding:6px 10px; cursor:pointer; font-size:var(--fs-sm); min-height:34px; white-space:nowrap;
}
.stance button:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm)}
.stance button:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0}
.stance button:hover{background:var(--sunken); color:var(--ink)}
.stance button.on.ja{background:var(--ok); border-color:var(--ok); color:var(--bg)}
.stance button.on.absprache{background:var(--warn); border-color:var(--warn); color:var(--bg)}
.stance button.on.nein{background:var(--crit); border-color:var(--crit); color:var(--bg)}
.gnote{margin:0 16px 12px; }
.gsummary{display:flex; gap:8px; flex-wrap:wrap; padding:14px 16px}
@media (max-width:640px){
  .grow{grid-template-columns:1fr; gap:8px; padding:12px 14px}
  .stance{width:100%}
  .stance button{flex:1; min-height:42px; font-size:var(--fs-sm)}
  .gsec{padding:14px 14px 6px}
  .gnote{margin:0 14px 12px}
  .gsummary{padding:14px}
}

/* ============================================================
   Terminfindung
   ============================================================ */
.cal-head{display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line)}
.cal-head .mo{font-weight:600; font-size:var(--fs-lg); flex:1; letter-spacing:-.01em}
.cal-nav{display:flex; gap:4px}
.cal-nav button{
  width:32px; height:32px; border:1px solid var(--line-2); background:var(--surface);
  border-radius:var(--r-sm); cursor:pointer; color:var(--ink-2); line-height:1; font-size:var(--fs-lg);
}
.cal-nav button:hover{background:var(--sunken); color:var(--ink)}

.cal-dow{display:grid; grid-template-columns:repeat(7,1fr); padding:8px 10px 2px; gap:4px}
.cal-dow span{
  text-align:center; font-family:"DM Mono",monospace; font-size:var(--fs-xs); letter-spacing:.1em;
  text-transform:uppercase; color:var(--ink-3);
}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; padding:2px 10px 12px}
.cal-cell{
  position:relative; aspect-ratio:1/1; min-height:44px; border:1px solid var(--line);
  background:var(--surface); border-radius:var(--r-sm); cursor:pointer; padding:4px 3px 3px;
  display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink);
}
.cal-cell:hover{border-color:var(--line-3); background:var(--sunken)}
.cal-cell.void{visibility:hidden; cursor:default}
.cal-cell.past{opacity:.42}
.cal-cell.today{border-color:var(--ink-3)}
.cal-cell.on{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-tint)}
.cal-cell.match{background:var(--accent-tint); border-color:var(--accent)}
.cal-cell .n{font-family:"DM Mono",monospace; font-size:var(--fs-sm); font-variant-numeric:tabular-nums; line-height:1.1}
.cal-cell.today .n{font-weight:500; text-decoration:underline; text-underline-offset:2px}
.cal-bars{display:flex; flex-direction:column; gap:2px; width:100%; margin-top:auto}
.cal-bars i{display:block; height:3px; border-radius:2px; background:var(--line)}
.cal-bars i.ja{background:var(--ok)}
.cal-bars i.vielleicht{background:var(--warn)}
.cal-bars i.nein{background:var(--crit)}
.cal-cell .shoot{position:absolute; top:3px; right:4px; width:5px; height:5px; border-radius:50%; background:var(--accent)}

.legend{display:flex; gap:14px; flex-wrap:wrap; padding:0 16px 14px; font-size:var(--fs-sm); color:var(--ink-2)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:3px; border-radius:2px; display:block}

.daybox{border-top:1px solid var(--line); padding:14px 16px; display:flex; flex-direction:column; gap:12px}
.states{display:flex; gap:6px; flex-wrap:wrap}
.state-btn{
  flex:1; min-width:96px; border:1px solid var(--line-2); background:var(--surface);
  padding:9px 10px; border-radius:var(--r-sm); cursor:pointer; font-size:var(--fs-md); font-weight:500;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
}
.state-btn i{width:8px; height:8px; border-radius:50%; background:var(--line-3); flex:none}
.state-btn.ja i{background:var(--ok)}
.state-btn.vielleicht i{background:var(--warn)}
.state-btn.nein i{background:var(--crit)}
.state-btn.on{border-color:var(--ink); background:var(--ink); color:var(--bg)}
.presets{display:flex; gap:6px; flex-wrap:wrap}
.other{border:1px solid var(--line); border-radius:var(--r-sm); background:var(--sunken); padding:10px 12px; font-size:var(--fs-md)}

.match-row{display:flex; gap:12px; align-items:center; padding:11px 16px; flex-wrap:wrap}
.match-row .d{font-family:"DM Mono",monospace; font-size:var(--fs-sm); font-variant-numeric:tabular-nums; min-width:104px}
.prop{display:flex; gap:12px; padding:12px 16px; align-items:flex-start; flex-wrap:wrap}
.prop .when{min-width:150px}
.prop .when b{display:block; font-size:var(--fs-md); font-weight:600}
.prop .when span{font-family:"DM Mono",monospace; font-size:var(--fs-sm); color:var(--ink-2); font-variant-numeric:tabular-nums}
.vote{display:flex; gap:6px}
.vote button{
  border:1px solid var(--line-2); background:var(--surface); border-radius:var(--r-sm);
  padding:6px 12px; cursor:pointer; font-size:var(--fs-sm); min-height:34px;
}
.vote button.on.ja{background:var(--ok-tint); border-color:var(--ok); color:var(--ok)}
.vote button.on.vielleicht{background:var(--warn-tint); border-color:var(--warn); color:var(--warn)}
.vote button.on.nein{background:var(--crit-tint); border-color:var(--crit); color:var(--crit)}

@media (max-width:640px){
  .cal-head{padding:11px 14px}
  .cal-dow{padding:8px 8px 2px; gap:3px}
  .cal-grid{gap:3px; padding:2px 8px 12px}
  .cal-cell{min-height:40px; padding:3px 2px}
  .cal-cell .n{font-size:var(--fs-sm)}
  .daybox{padding:14px}
  .state-btn{min-height:44px; min-width:0; flex:1 1 30%}
  .legend{padding:0 14px 12px; gap:10px; font-size:var(--fs-sm)}
  .match-row,.prop{padding:12px 14px}
  .vote{width:100%}
  .vote button{flex:1; min-height:40px}
}

/* ============================================================
   Bildansicht
   ============================================================ */
.phbtn{
  display:block; width:100%; padding:0; border:none; background:none;
  cursor:zoom-in; line-height:0;
}
.phbtn:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.thumbbtn{padding:0; border:none; background:none; cursor:zoom-in; line-height:0; flex:none}

.lb{
  position:fixed; inset:0; z-index:200; background:rgba(10,10,8,.95);
  display:flex; flex-direction:column; color:#EFEDE6;
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
}
.lb-top{
  display:flex; align-items:center; gap:12px; padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top)); flex:none;
}
.lb-top .count{
  font-family:"DM Mono",monospace; font-size:12.5px; font-variant-numeric:tabular-nums;
  color:rgba(239,237,230,.7); letter-spacing:.08em;
}
.lb-top .sp{flex:1}
.lb-x{
  width:40px; height:40px; border-radius:50%; border:1px solid rgba(239,237,230,.28);
  background:transparent; color:#EFEDE6; cursor:pointer; font-size:20px; line-height:1; flex:none;
}
.lb-x:hover{background:rgba(239,237,230,.12)}
.lb-stage{flex:1; min-height:0; position:relative; display:grid; place-items:center; padding:0 8px}
.lb-stage img{max-width:100%; max-height:100%; object-fit:contain; display:block; border-radius:2px}
.lb-nav{
  position:absolute; top:50%; transform:translateY(-50%);
  width:46px; height:46px; border-radius:50%; border:1px solid rgba(239,237,230,.28);
  background:rgba(10,10,8,.5); color:#EFEDE6; cursor:pointer; font-size:22px; line-height:1;
}
.lb-nav:hover{background:rgba(239,237,230,.16)}
.lb-nav.prev{left:10px}
.lb-nav.next{right:10px}
.lb-foot{
  flex:none; padding:14px 18px; padding-bottom:calc(16px + env(safe-area-inset-bottom));
  max-width:70ch; margin:0 auto; width:100%;
}
.lb-foot .cap{font-size:15px; line-height:1.55}
.lb-foot .meta{
  font-family:"DM Mono",monospace; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase;
  color:rgba(239,237,230,.6); margin-top:6px;
}
@media (max-width:640px){
  .lb-stage{padding:0}
  .lb-nav{width:42px; height:42px}
  .lb-nav.prev{left:6px}
  .lb-nav.next{right:6px}
  .lb-foot{padding:14px 16px; padding-bottom:calc(16px + env(safe-area-inset-bottom))}
  .lb-foot .cap{font-size:15px}
}

/* ============================================================
   Rechtliches
   ============================================================ */
.legal{min-height:100dvh; background:var(--bg)}
.legal-in{max-width:74ch; margin:0 auto; padding:28px 22px calc(70px + env(safe-area-inset-bottom))}
@media (max-width:640px){.legal-in{padding:20px 16px calc(60px + env(safe-area-inset-bottom))}}
.legal h1{font-size:26px; letter-spacing:-.025em; margin-bottom:6px}
.legal h2{font-size:var(--fs-xl); margin:30px 0 8px; letter-spacing:-.015em}
.legal h3{font-size:var(--fs-lg); margin:20px 0 6px}
.legal p, .legal li{font-size:var(--fs-md); line-height:1.68; color:var(--ink-2)}
.legal p{margin:8px 0}
.legal ul{margin:8px 0; padding-left:20px}
.legal li{margin:5px 0}
.legal strong{color:var(--ink); font-weight:600}
.legal .adr{font-style:normal; line-height:1.7; font-size:var(--fs-md)}
.legal dl.dl{margin-top:6px}
.legal-bar{
  position:sticky; top:0; z-index:20; background:var(--bg); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px; padding:12px 22px;
  padding-top:calc(12px + env(safe-area-inset-top));
}
@media (max-width:640px){.legal-bar{padding:10px 16px; padding-top:calc(10px + env(safe-area-inset-top))}}
.legal-bar .sp{flex:1}
.sitefoot{
  display:flex; gap:14px; flex-wrap:wrap; align-items:center; justify-content:center;
  padding:22px 16px calc(22px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line); margin-top:auto;
}
.sitefoot button, .sitefoot a{
  background:none; border:none; padding:4px 2px; cursor:pointer; font-size:var(--fs-sm);
  color:var(--ink-3); text-decoration:none;
}
.sitefoot button:hover, .sitefoot a:hover{color:var(--ink); text-decoration:underline}
.rail-legal{display:flex; gap:10px; flex-wrap:wrap; padding:0 14px 12px}
.rail-legal button{
  background:none; border:none; padding:2px; cursor:pointer; font-size:var(--fs-xs); color:var(--ink-3);
}
.rail-legal button:hover{color:var(--ink); text-decoration:underline}
.paypal{
  display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line-2);
  background:var(--surface); color:var(--ink); padding:9px 15px; border-radius:var(--r-sm);
  font-size:var(--fs-md); font-weight:500; text-decoration:none; box-shadow:var(--shadow-1);
}
.paypal:hover{background:var(--sunken); border-color:var(--line-3)}
.paypal .pp{font-weight:700; letter-spacing:-.02em; font-style:italic; color:var(--accent)}
.gap-warn{
  border:1px solid var(--crit); background:var(--crit-tint); color:var(--crit);
  border-radius:var(--r-sm); padding:12px 14px; font-size:var(--fs-md); margin:14px 0;
}

/* Sonstiges */
.spin{display:inline-block; width:12px; height:12px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{
  position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:99;
  background:var(--ink); color:var(--bg); padding:9px 15px; border-radius:var(--r-sm);
  font-size:var(--fs-md); box-shadow:var(--shadow-2); max-width:min(90vw,520px);
}
.scrim{position:fixed; inset:0; background:rgba(10,10,8,.42); z-index:60; display:grid; place-items:center; padding:20px}
.sheetbox{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-2); width:min(440px,100%)}
hr.sep{border:none; border-top:1px solid var(--line); margin:14px 0}
.hscroll{overflow-x:auto}

/* ============================================================
   Kopfzeilen-Bausteine
   ============================================================ */
.tb-title{flex:1; min-width:0}
.tb-acts{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.card > .hd{flex-wrap:wrap}

/* ============================================================
   Kleine Displays
   ============================================================ */
.only-m{display:none}

@media (max-width:980px){
  .only-m{display:inline-flex}
  .not-m{display:none}

  /* Liste und Detail sind zwei Ansichten, nicht zwei gestapelte Blöcke. */
  .app.m-list .col-main{display:none}
  .app.m-detail .rail{display:none}
  .app{min-height:100dvh}

  .rail{position:static; min-height:0; max-height:none; border-right:none; border-bottom:none}
  .app.m-list .rail{min-height:100dvh}
  .rail-scroll{overflow:visible; padding:0 10px 20px}
  .mark{padding:14px 16px 12px; padding-top:calc(14px + env(safe-area-inset-top))}
  .rail-tools{padding:0 16px 14px}
  .rail-foot{padding:12px 16px; padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .entry{padding:12px 10px}
  .e-title{font-size:var(--fs-md)}
}

@media (max-width:900px){
  .split{gap:14px}
  /* Termin, Code und Fortschritt zuerst — danach die langen Texte. */
  .split > :last-child{order:-1}
}

@media (max-width:640px){
  /* Auf dem Handy eine ganze Stufe groesser */
  :root{--fs-xs:12.5px; --fs-sm:13.5px; --fs-md:15px; --fs-lg:16px; --fs-xl:18.5px}
  body{font-size:16px; line-height:1.55}

  .topbar-in{padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top)); gap:10px; flex-wrap:wrap}
  .topbar h1{font-size:var(--fs-xl)}
  .tb-title{flex:1 1 auto; order:1}
  .backbtn{order:0; min-width:34px; padding:0 8px; font-size:20px; line-height:1}
  .tb-acts{order:2; flex:1 1 100%; justify-content:space-between}

  .tabs{padding:0 14px; gap:15px; scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:13px 0 12px; font-size:var(--fs-md)}

  .content{padding:16px 14px calc(72px + env(safe-area-inset-bottom))}

  /* 16px verhindert, dass iOS beim Antippen ins Feld zoomt. */
  /* Genau 16px: darunter zoomt iOS beim Antippen hinein. */
  .inp{font-size:16px; padding:11px 12px}
  textarea.inp{min-height:84px}
  select.inp{background-position:calc(100% - 15px) 52%, calc(100% - 10px) 52%}
  .inp-sm{font-size:16px; padding:8px 10px}
  .field > .lab{font-size:var(--fs-xs)}

  .btn{min-height:42px; padding:9px 14px}
  .btn-sm{min-height:38px; font-size:var(--fs-sm)}
  .chip{padding:7px 13px; font-size:var(--fs-md)}
  .g2{grid-template-columns:1fr; gap:12px}
  .row{gap:8px}
  .row > .field{flex:1 1 140px}

  .card > .hd{padding:12px 14px}
  .card > .bd{padding:14px}
  .cards{gap:14px}

  .rw{flex-wrap:wrap; padding:12px 14px}
  .rw .acts{width:100%; justify-content:flex-start; margin-top:4px}
  .acts .inp-sm{flex:1; min-width:120px; max-width:200px}

  .slot{grid-template-columns:24px minmax(0,1fr); gap:10px; padding:12px 14px}
  .slot .thumb{display:none}
  .slot .acts{grid-column:2; margin-top:8px; flex-wrap:wrap}

  .chk{padding:13px 14px; gap:12px}
  .chk input{width:20px; height:20px}

  .gal{grid-template-columns:repeat(auto-fill,minmax(138px,1fr)); gap:10px}
  .shot .rm{opacity:1; width:26px; height:26px}

  .tl{padding:4px 14px 10px}
  .tl-row{grid-template-columns:62px minmax(0,1fr); gap:10px}
  .tl-row::before{left:62px}
  .tl-row .dot{left:59px}
  .tl-row .tm{font-size:var(--fs-sm)}

function extUrl(v) {
  var s = String(v || "").trim();
  if (!s) return null;
  if (/^https?:\/\//i.test(s)) return s;
  if (s.charAt(0) === "@") return "https://instagram.com/" + s.slice(1);
  return "https://" + s;
}
function extLabel(v) {
  var s = String(v || "").trim().replace(/^https?:\/\//i, "").replace(/^www\./i, "").replace(/\/+$/, "");
  return s.length > 32 ? s.slice(0, 31) + "…" : s;
}

  useEffect(function () { loadDetail(sel); }, [sel]);

  /* Änderungen der anderen Seite sollen ankommen, ohne dass man neu lädt.

  useEffect(function () {
    if (!sel) return;
    var pending = null, alive = true;
    function refresh() {
      if (!alive || document.hidden) return;

    }
    var channel = sb.channel("planung-" + sel);
    ["ps_comments", "ps_ideas", "ps_images", "ps_checklist", "ps_shots",
     "ps_schedule", "ps_availability", "ps_proposals", "ps_genres"].forEach(function (t) {

    });

    channel.subscribe();

    return function () {

      window.removeEventListener("focus", onWake);
      sb.removeChannel(channel);

/* ============================================================

   ============================================================ */
function haversine(a, b, c, d2) {
  var R = 6371, t = Math.PI / 180;

    Math.cos(a * t) * Math.cos(c * t) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
}
/* Koordinaten aus einem eingefügten Kartenlink ziehen — ohne Netzabfrage */
function coordsFromText(t) {
  var s = String(t || "");
  var m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)                       // Google Maps
       || s.match(/[?&]q=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)               // ?q=lat,lng
       || s.match(/[?&]mlat=(-?\d+\.\d+)[^]*?[?&]mlon=(-?\d+\.\d+)/)  // OpenStreetMap
       || s.match(/#map=\d+\/(-?\d+\.\d+)\/(-?\d+\.\d+)/)             // OSM Permalink
       || s.match(/^\s*(-?\d{1,2}\.\d+)\s*[,;]\s*(-?\d{1,3}\.\d+)\s*$/); // reine Koordinaten
  if (!m) return null;
  var la = parseFloat(m[1]), ln = parseFloat(m[2]);
  if (isNaN(la) || isNaN(ln) || Math.abs(la) > 90 || Math.abs(ln) > 180) return null;
  return { lat: la, lng: ln };
}
function routeLinks(startText, startPt, lat, lng) {
  var to = lat + "," + lng;
  var orgRaw = startPt ? (startPt.lat + "," + startPt.lng) : (startText || "");
  var org = orgRaw ? encodeURIComponent(orgRaw) : "";
  var out = [
    ["Google Maps", "https://www.google.com/maps/dir/?api=1" + (org ? "&origin=" + org : "") +
      "&destination=" + to + "&travelmode=driving"],
    ["Apple Karten", "https://maps.apple.com/?daddr=" + to + (org ? "&saddr=" + org : "") + "&dirflg=d"]
  ];
  /* OpenStreetMap kann nur Koordinaten, keine Adressen */
  out.push(startPt
    ? ["OpenStreetMap", "https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=" +
        startPt.lat + "," + startPt.lng + ";" + to]
    : ["Auf OpenStreetMap", "https://www.openstreetmap.org/?mlat=" + lat + "&mlon=" + lng + "#map=16/" + lat + "/" + lng]);
  return out;
}

/* Adresse -> Koordinaten, über die Suche von OpenStreetMap.
   Läuft nur auf Knopfdruck, nicht beim Tippen — der Dienst ist frei,
   aber ausdrücklich nicht für Dauerfeuer gedacht. */
function geocode(q) {
  var url = "https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=0&limit=5"
          + "&accept-language=de&q=" + encodeURIComponent(q);
  return fetch(url, { headers: { "Accept": "application/json" } }).then(function (r) {
    if (!r.ok) throw new Error("Antwort " + r.status);
    return r.json();
  }).then(function (list) {
    return (list || []).map(function (x) {
      return { lat: parseFloat(x.lat), lng: parseFloat(x.lon), label: x.display_name };
    }).filter(function (x) { return !isNaN(x.lat) && !isNaN(x.lng); });
  });
}

var leafletLoading = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve(window.L);
  if (leafletLoading) return leafletLoading;
  leafletLoading = new Promise(function (resolve, reject) {
    var css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    var js = document.createElement("script");
    js.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    js.onload = function () { resolve(window.L); };
    js.onerror = function () { reject(new Error("Kartenbibliothek nicht erreichbar")); };
    document.head.appendChild(js);
  });
  return leafletLoading;
}

function Genres(props) {
  var admin = !!props.admin, p = props.planning;

  var party = admin ? "inhaber" : "gast";
  var otherParty = admin ? "gast" : "inhaber";
  var otherName = admin ? (props.guestName || GUEST_FALLBACK) : (props.hostName || HOST_FALLBACK);
  var a = useState({}), notes = a[0], setNotes = a[1];
  var b = useState(""), busyKey = b[0], setBusy = b[1];

  var by = {};

    if (!by[r.genre]) by[r.genre] = {};
    by[r.genre][r.party] = r;
  });

  function write(key, stance, note) {
    setBusy(key);
    var q = props.code
      ? sb.rpc("ps_set_genre", { p_code: props.code, p_author: props.authorName, p_genre: key, p_stance: stance, p_note: note || null })
      : sb.from("ps_genres").upsert({

          author_id: props.userId || null, author_name: props.authorName || null

      setBusy("");

    Promise.resolve(q).then(function () { setBusy(""); props.reload(); });
  }

    var mine = (by[key] || {})[party];

    write(key, st, mine ? mine.note : null);

    var mine = (by[key] || {})[party];

        div({ className: "rows" },
          grp[1].map(function (it) {

                          ii(null), otherName + ": " + lbl(STANCE, theirs.stance))

                div({ className: "stance" },
                  STANCE.map(function (s) {

                      key: s[0], className: (mine && mine.stance === s[0] ? "on " + s[0] : ""),

        : tab === "zeitplan" ? h(Schedule, { hostName: hostName, guestName: guestName, planning: p, rows: bundle.schedule, reload: reload, toast: props.toast })
        : h(Chat, { hostName: hostName, guestName: guestName, planning: p, comments: bundle.comments, code: code, reload: reload, toast: props.toast, authorName: name })),
    h(SiteFoot, { onPage: props.onLegal }));
}

        "Die Person, die diese Planung führt, hat ihr Profil noch nicht ausgefüllt."));
  }
  var sub = [hst.role_label, hst.city].filter(Boolean).join(" · ");
  var ig = extUrl(hst.instagram), web = extUrl(hst.website);
  return Card({ title: props.title || "Ansprechpartner:in" },
    div({ className: "row", style: { gap: 14, alignItems: "center", flexWrap: "nowrap" } },
      Avatar({ url: hst.avatar_url, name: hst.display_name, size: 72 }),
      div({ style: { minWidth: 0 } },
        h4({ style: { fontSize: "var(--fs-xl)" } }, hst.display_name),
        sub ? para({ className: "muted", style: { fontSize: "var(--fs-md)", marginTop: 2 } }, sub) : null)),
    hst.bio ? para({ style: { fontSize: "var(--fs-md)", lineHeight: 1.6, marginTop: 12 } }, hst.bio) : null,
    (ig || web) ? div({ className: "row", style: { gap: 8, marginTop: 12 } },
      ig ? h("a", { className: "btn btn-sm", href: ig, target: "_blank", rel: "noopener noreferrer" }, extLabel(hst.instagram)) : null,
      web ? h("a", { className: "btn btn-sm", href: web, target: "_blank", rel: "noopener noreferrer" }, extLabel(hst.website)) : null) : null);
}

function LockedView(props) {
  return div({ className: "locked" },
    div({ className: "box" },
      props.host && props.host.avatar_url
        ? Avatar({ url: props.host.avatar_url, name: props.host.display_name, size: 72 })
        : null,
      span({ className: "lab" }, "Noch in Vorbereitung"),
      h2({ className: "serif", style: { fontSize: 25, letterSpacing: "-.02em" } }, props.title),

        (props.host && props.host.display_name ? props.host.display_name + " stellt" : "Die Planung wird")
        + " gerade zusammen. Sobald freigegeben ist, erscheint hier alles — du musst nichts weiter tun, die Seite aktualisiert sich von selbst."),

}

function ModelOverview(props) {

  var done = mine.filter(function (x) { return x.done; }).length;
  return div({ className: "split" },

          div(null, dt({ className: "lab" }, "Moodboard"), dd(null, "Referenzbilder hochladen oder verlinken, damit ihr dieselbe Bildsprache im Kopf habt.")),

          Ring({ value: mine.length ? done / mine.length : 0 }),
          div(null,
            div({ className: "big" }, done + " / " + mine.length),

/* ---------- Neues Passwort nach dem Link aus der Mail ---------- */
function NewPassword(props) {
  var a = useState(""), pw = a[0], setPw = a[1];
  var b = useState(""), pw2 = b[0], setPw2 = b[1];
  var c = useState(""), err = c[0], setErr = c[1];
  var d = useState(false), busy = d[0], setBusy = d[1];

  function save(ev) {
    ev.preventDefault();
    if (pw.length < 6) { setErr("Das Passwort braucht mindestens sechs Zeichen."); return; }
    if (pw !== pw2) { setErr("Die beiden Eingaben stimmen nicht überein."); return; }
    setBusy(true); setErr("");
    sb.auth.updateUser({ password: pw }).then(function (r) {
      setBusy(false);
      if (r.error) { setErr(r.error.message); return; }
      props.done();
    });
  }

  return div({ className: "entrance", style: { gridTemplateColumns: "1fr" } },
    div({ className: "right", style: { maxWidth: 420, margin: "0 auto", width: "100%" } },
      span({ className: "lab" }, "Konto"),
      h2({ className: "serif", style: { fontSize: 27, letterSpacing: "-.02em" } }, "Neues Passwort setzen"),
      para({ className: "muted" }, "Wähle ein Passwort, dann bist du direkt angemeldet."),
      frm({ className: "col", onSubmit: save },
        Field({ label: "Neues Passwort" },
          inp({ className: "inp", type: "password", value: pw, autoFocus: true, autoComplete: "new-password",
            onChange: function (ev) { setPw(ev.target.value); } })),
        Field({ label: "Noch einmal" },
          inp({ className: "inp", type: "password", value: pw2, autoComplete: "new-password",
            onChange: function (ev) { setPw2(ev.target.value); } })),
        btn({ className: "btn btn-pri btn-wide", disabled: busy },
          busy ? span({ className: "spin" }) : null, "Passwort speichern")),
      err ? div({ className: "hint bad" }, err) : null));
}

/* ============================================================
   Wurzel
   ============================================================ */
function App() {
  var a = useState(null), session = a[0], setSession = a[1];
  var b = useState(false), ready = b[0], setReady = b[1];
  var c = useState(null), model = c[0], setModel = c[1];
  var d = useState(""), msg = d[0], setMsg = d[1];
  var e = useState(false), recovery = e[0], setRecovery = e[1];
  var lg = useState(null), legal = lg[0], setLegal = lg[1];
  var timer = useRef(null);

  var toast = useCallback(function (m) {
    setMsg(m);
    clearTimeout(timer.current);
    timer.current = setTimeout(function () { setMsg(""); }, 3400);
  }, []);

  useEffect(function () {
    sb.auth.getSession().then(function (r) { setSession(r.data.session); setReady(true); });
    var sub = sb.auth.onAuthStateChange(function (evt, s) {
      setSession(s);
      if (evt === "PASSWORD_RECOVERY") setRecovery(true);
    });
    return function () { sub.data.subscription.unsubscribe(); };
  }, []);

  function leave() { location.hash = ""; setModel(null); }

  var view;
  if (legal) {
    return h(Frag, null,
      h(LegalPage, { page: legal, onPage: setLegal, onBack: function () { setLegal(null); } }),
      Toast({ msg: msg }));
  }
  if (!ready) view = div({ style: { display: "grid", placeItems: "center", minHeight: "100vh" } }, span({ className: "spin" }));
  else if (recovery) view = h(NewPassword, { done: function () { setRecovery(false); toast("Passwort geändert"); } });
  else if (model) view = h(ModelApp, { code: model.code, initial: model.data, toast: toast,
                                      onLeave: leave, onLegal: setLegal });
  else if (session) view = h(AdminApp, { session: session, toast: toast, onLegal: setLegal });
  else view = h(Entrance, { onModel: function (code, data) { setModel({ code: code, data: data }); },
                            toast: toast, onLegal: setLegal });

  return h(Frag, null, view, Toast({ msg: msg }));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));

})();
</script>
