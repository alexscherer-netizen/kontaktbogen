<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kontaktbogen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
/* ============================================================
   Tokens
   ============================================================ */
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --sunken:#F2F0EB; --raised:#FFFFFF;
  --line:#E6E2DA; --line-2:#D1CBBF; --line-3:#B8B1A2;
  --ink:#191813; --ink-2:#59554B; --ink-3:#8B8578;
  --accent:#12504E; --accent-hi:#0C3B39; --accent-tint:#E3EEEB; --on-accent:#FFFFFF;
  --ok:#2E6B4F; --ok-tint:#E5F0E9;
  --warn:#96660F; --warn-tint:#F6EEDC;
  --crit:#9B342C; --crit-tint:#F7E9E6;
  --shadow-1:0 1px 2px rgba(25,24,19,.05);
  --shadow-2:0 12px 32px -20px rgba(25,24,19,.45), 0 1px 2px rgba(25,24,19,.06);
  --r:7px; --r-sm:5px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121310; --surface:#1A1C18; --sunken:#16180F; --raised:#20231E;
    --line:#2B2E27; --line-2:#3B3F36; --line-3:#4E5347;
    --ink:#EDEBE4; --ink-2:#A9A599; --ink-3:#7D786B;
    --accent:#6FC0B4; --accent-hi:#8FD4C9; --accent-tint:#16332F; --on-accent:#0B1F1D;
    --ok:#63B98C; --ok-tint:#16281F;
    --warn:#D3A249; --warn-tint:#2C2415;
    --crit:#DE8177; --crit-tint:#2E1A17;
    --shadow-1:0 1px 2px rgba(0,0,0,.5);
    --shadow-2:0 16px 40px -24px #000, 0 1px 2px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121310; --surface:#1A1C18; --sunken:#16180F; --raised:#20231E;
  --line:#2B2E27; --line-2:#3B3F36; --line-3:#4E5347;
  --ink:#EDEBE4; --ink-2:#A9A599; --ink-3:#7D786B;
  --accent:#6FC0B4; --accent-hi:#8FD4C9; --accent-tint:#16332F; --on-accent:#0B1F1D;
  --ok:#63B98C; --ok-tint:#16281F;
  --warn:#D3A249; --warn-tint:#2C2415;
  --crit:#DE8177; --crit-tint:#2E1A17;
  --shadow-1:0 1px 2px rgba(0,0,0,.5);
  --shadow-2:0 16px 40px -24px #000, 0 1px 2px rgba(0,0,0,.6);
  color-scheme:dark;
}

/* ============================================================
   Grundlagen
   ============================================================ */
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  font-feature-settings:"ss01" on;
  overflow-wrap:break-word;
  -webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4{margin:0; font-weight:600; text-wrap:balance; letter-spacing:-.012em}
p{margin:0}
button,input,textarea,select{font:inherit; color:inherit}
a{color:var(--accent); text-underline-offset:3px}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
::selection{background:var(--accent-tint)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.serif{font-family:"Source Serif 4",Georgia,serif}
.mono{font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.lab{
  font-family:"DM Mono",monospace; font-size:10px; font-weight:500;
  letter-spacing:.13em; text-transform:uppercase; color:var(--ink-3);
}
.trunc{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ============================================================
   App-Rahmen
   ============================================================ */
.app{display:grid; grid-template-columns:272px minmax(0,1fr); min-height:100vh}
@media (max-width:980px){.app{grid-template-columns:1fr}}

.rail{
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:100vh;
  position:sticky; top:0; max-height:100vh;
}
@media (max-width:980px){.rail{position:static; min-height:0; max-height:none; border-right:none; border-bottom:1px solid var(--line)}}

.mark{display:flex; align-items:center; gap:10px; padding:16px 18px 14px}
.mark .glyph{
  width:26px; height:26px; border:1px solid var(--ink); border-radius:2px; flex:none;
  display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; overflow:hidden;
}
.mark .glyph i{display:block; background:var(--ink); opacity:.14}
.mark .glyph i:nth-child(2){opacity:.45}
.mark .glyph i:nth-child(3){background:var(--accent); opacity:1}
.mark .glyph i:nth-child(4){opacity:.26}
.mark .name{font-weight:600; letter-spacing:-.02em; font-size:15px; line-height:1.1}
.mark .sub{font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-family:"DM Mono",monospace}

.rail-tools{padding:0 14px 12px; display:flex; flex-direction:column; gap:8px}
.rail-scroll{overflow-y:auto; padding:0 8px 16px; flex:1; min-height:0}
.rail-foot{border-top:1px solid var(--line); padding:10px 14px; display:flex; align-items:center; gap:8px}
.rail-foot .who{flex:1; min-width:0; font-size:12px; color:var(--ink-3)}

.group-head{
  display:flex; align-items:center; gap:8px; padding:14px 8px 6px;
}
.group-head .lab{white-space:nowrap}
.group-head .rule{flex:1; height:1px; background:var(--line)}

/* Planungseintrag */
.entry{
  width:100%; display:grid; grid-template-columns:38px minmax(0,1fr); gap:11px;
  text-align:left; background:transparent; border:none; cursor:pointer;
  padding:9px 10px; border-radius:var(--r); align-items:start;
}
.entry:hover{background:var(--sunken)}
.entry.on{background:var(--sunken)}
.entry.on .e-title{color:var(--ink)}
.e-date{
  border:1px solid var(--line-2); border-radius:var(--r-sm); padding:3px 0 4px;
  text-align:center; font-family:"DM Mono",monospace; line-height:1.05; background:var(--surface);
}
.e-date b{display:block; font-size:14px; font-weight:500; font-variant-numeric:tabular-nums}
.e-date span{display:block; font-size:8.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin-top:2px}
.entry.on .e-date{border-color:var(--accent); color:var(--accent)}
.entry.on .e-date span{color:var(--accent)}
.e-title{font-weight:500; font-size:13.5px; line-height:1.3; display:flex; align-items:center; gap:6px}
.e-title .dot{width:5px; height:5px; border-radius:50%; flex:none}
.e-meta{font-family:"DM Mono",monospace; font-size:11px; color:var(--ink-3); margin-top:3px}

/* ============================================================
   Kopfzeile im Inhalt
   ============================================================ */
.topbar{
  position:sticky; top:0; z-index:20; border-bottom:1px solid var(--line);
  background:var(--bg); background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
}
@supports not (backdrop-filter: blur(2px)){.topbar{background:var(--bg)}}
.topbar-in{display:flex; align-items:center; gap:14px; padding:13px 28px}
@media (max-width:640px){.topbar-in{padding:12px 16px; flex-wrap:wrap}}
.topbar h1{font-size:17px; letter-spacing:-.02em}
.topbar .sp{flex:1}
.crumb{font-family:"DM Mono",monospace; font-size:11px; color:var(--ink-3); letter-spacing:.06em}

.tabs{display:flex; gap:22px; padding:0 28px; border-bottom:1px solid var(--line); overflow-x:auto; background:var(--bg)}
@media (max-width:640px){.tabs{padding:0 16px; gap:16px}}
.tab{
  background:none; border:none; cursor:pointer; padding:11px 0 10px; white-space:nowrap;
  font-size:13px; font-weight:500; color:var(--ink-3); border-bottom:1.5px solid transparent;
  margin-bottom:-1px; display:flex; align-items:center; gap:7px;
}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink); border-bottom-color:var(--accent)}
.tab .cnt{
  font-family:"DM Mono",monospace; font-size:10.5px; background:var(--sunken); color:var(--ink-3);
  padding:1px 5px; border-radius:4px; font-variant-numeric:tabular-nums;
}
.tab.on .cnt{background:var(--accent-tint); color:var(--accent)}

.content{padding:24px 28px 80px; max-width:1180px}
@media (max-width:640px){.content{padding:18px 16px 60px}}

/* ============================================================
   Bedienelemente
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
  padding:7px 13px; border-radius:var(--r-sm); cursor:pointer; font-size:13px; font-weight:500;
  box-shadow:var(--shadow-1); transition:background .12s ease, border-color .12s ease;
}
.btn:hover{background:var(--sunken); border-color:var(--line-3)}
.btn[disabled]{opacity:.45; cursor:not-allowed}
.btn-pri{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.btn-pri:hover{background:var(--accent-hi); border-color:var(--accent-hi)}
.btn-quiet{border-color:transparent; background:transparent; box-shadow:none; color:var(--ink-2)}
.btn-quiet:hover{background:var(--sunken); color:var(--ink)}
.btn-sm{padding:4px 9px; font-size:12px}
.btn-wide{width:100%}
.btn-danger:hover{border-color:var(--crit); color:var(--crit); background:var(--crit-tint)}

.inp{
  width:100%; background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r-sm);
  padding:7px 10px; color:var(--ink); box-shadow:var(--shadow-1);
}
.inp::placeholder{color:var(--ink-3)}
.inp:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint)}
textarea.inp{resize:vertical; min-height:66px; line-height:1.55}
select.inp{appearance:none; padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%, calc(100% - 9px) 52%;
  background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
}
.inp-sm{padding:4px 8px; font-size:12.5px; width:auto}
.search{position:relative}
.search .inp{padding-left:28px}
.search svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--ink-3)}

.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field > .lab{margin-bottom:1px}
.row{display:flex; gap:10px; flex-wrap:wrap}
.col{display:flex; flex-direction:column; gap:10px}
.g2{display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px}

/* Filterchips */
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  padding:4px 11px; border-radius:100px; font-size:12.5px; cursor:pointer;
}
.chip:hover{border-color:var(--line-3); color:var(--ink)}
.chip.on{background:var(--ink); border-color:var(--ink); color:var(--bg)}

/* Status */
.st{
  display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500;
  padding:2.5px 9px 2.5px 7px; border-radius:100px; border:1px solid transparent; white-space:nowrap;
}
.st i{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.st-idee{background:var(--sunken); color:var(--ink-2); border-color:var(--line)}
.st-geplant{background:var(--accent-tint); color:var(--accent); border-color:transparent}
.st-bestaetigt{background:var(--ok-tint); color:var(--ok)}
.st-erledigt{background:var(--ok-tint); color:var(--ok)}
.st-erledigt i{border-radius:1px}
.st-verworfen,.st-abgesagt{background:var(--crit-tint); color:var(--crit)}

/* ============================================================
   Flächen
   ============================================================ */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-1)}
.card > .hd{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:13px 16px; border-bottom:1px solid var(--line);
}
.card > .hd h3{font-size:13.5px}
.card > .bd{padding:16px}
.card > .bd.flush{padding:0}
.cards{display:flex; flex-direction:column; gap:16px}
.split{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(280px,.9fr); gap:16px; align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}}

.rows > *{border-top:1px solid var(--line)}
.rows > *:first-child{border-top:none}
.rw{display:flex; gap:12px; padding:11px 16px; align-items:flex-start}
.rw:hover{background:var(--sunken)}

.dl{display:flex; flex-direction:column}
.dl > div{display:flex; align-items:baseline; gap:12px; padding:9px 0; border-top:1px solid var(--line)}
.dl > div:first-child{border-top:none; padding-top:0}
.dl dt{flex:none; width:88px}
.dl dd{margin:0; flex:1; min-width:0; font-size:13.5px}

.empty{
  padding:30px 20px; text-align:center; color:var(--ink-3); font-size:13px;
  border:1px dashed var(--line-2); border-radius:var(--r); background:var(--sunken);
}
.hint{
  font-size:13px; color:var(--ink-2); background:var(--sunken);
  border:1px solid var(--line); border-left:2px solid var(--accent);
  padding:10px 13px; border-radius:0 var(--r-sm) var(--r-sm) 0;
}
.hint.bad{border-left-color:var(--crit); color:var(--crit); background:var(--crit-tint)}

/* Fortschritt */
.meter{display:flex; flex-direction:column; gap:6px}
.meter .top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:12.5px}
.meter .bar{height:5px; border-radius:100px; background:var(--sunken); overflow:hidden; border:1px solid var(--line)}
.meter .bar i{display:block; height:100%; background:var(--accent); border-radius:100px}
.ringwrap{display:flex; align-items:center; gap:16px}
.ringwrap .big{font-size:26px; font-weight:600; letter-spacing:-.03em; font-variant-numeric:tabular-nums}

/* Zugangscode */
.access{border:1px solid var(--line-2); border-radius:var(--r); overflow:hidden; background:var(--sunken)}
.access .val{
  font-family:"DM Mono",monospace; font-size:23px; letter-spacing:.3em; font-weight:500;
  padding:16px 14px 15px; text-align:center; background:var(--surface); border-bottom:1px solid var(--line);
  user-select:all;
}
.access .acts{display:flex}
.access .acts button{
  flex:1; background:transparent; border:none; border-left:1px solid var(--line); padding:8px 4px;
  font-size:12px; cursor:pointer; color:var(--ink-2);
}
.access .acts button:first-child{border-left:none}
.access .acts button:hover{background:var(--surface); color:var(--ink)}

/* Kontaktbogen / Galerie */
.gal{display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:12px}
.shot{border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; background:var(--sunken); position:relative}
.shot .ph{aspect-ratio:4/3; display:block; width:100%; object-fit:cover; background:var(--sunken)}
.shot .info{padding:8px 10px 9px; border-top:1px solid var(--line); background:var(--surface)}
.shot .info .t{font-size:12.5px; line-height:1.35; color:var(--ink)}
.shot .info .m{font-family:"DM Mono",monospace; font-size:10px; color:var(--ink-3); margin-top:3px; letter-spacing:.05em}
.shot .rm{
  position:absolute; top:6px; right:6px; background:var(--surface); border:1px solid var(--line-2);
  border-radius:4px; width:22px; height:22px; line-height:1; cursor:pointer; color:var(--ink-2);
  opacity:0; transition:opacity .12s;
}
.shot:hover .rm, .shot:focus-within .rm{opacity:1}
.shot .rm:hover{color:var(--crit); border-color:var(--crit)}
.shot .no{
  position:absolute; top:6px; left:6px; font-family:"DM Mono",monospace; font-size:9.5px;
  background:rgba(0,0,0,.62); color:#fff; padding:1px 5px; border-radius:3px; letter-spacing:.08em;
}

/* Shotlist-Zeile */
.slot{display:grid; grid-template-columns:26px 54px minmax(0,1fr) auto; gap:12px; padding:12px 16px; align-items:start}
@media (max-width:640px){.slot{grid-template-columns:26px minmax(0,1fr); }.slot .thumb{display:none}}
.slot .idx{font-family:"DM Mono",monospace; font-size:12px; color:var(--ink-3); padding-top:2px; font-variant-numeric:tabular-nums}
.thumb{width:54px; height:40px; object-fit:cover; border-radius:3px; border:1px solid var(--line); background:var(--sunken)}
.slot h4{font-size:13.5px; font-weight:500}
.slot .sub{font-size:13px; color:var(--ink-2); margin-top:3px; white-space:pre-wrap}
.tagrow{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px}
.tag{font-family:"DM Mono",monospace; font-size:10.5px; color:var(--ink-3); border:1px solid var(--line); border-radius:3px; padding:1px 6px}

/* Checkliste */
.chk{display:flex; gap:11px; padding:10px 16px; align-items:flex-start; cursor:pointer}
.chk input{margin:2px 0 0; width:15px; height:15px; accent-color:var(--accent); flex:none; cursor:pointer}
.chk .t{font-size:13.5px}
.chk.done .t{color:var(--ink-3); text-decoration:line-through}
.chk[data-locked="1"]{cursor:default}

/* Zeitplan */
.tl{padding:4px 16px 12px}
.tl-row{display:grid; grid-template-columns:96px minmax(0,1fr); gap:16px; position:relative; padding:12px 0 12px 0}
.tl-row::before{content:""; position:absolute; left:96px; top:0; bottom:0; width:1px; background:var(--line)}
.tl-row:first-child::before{top:16px}
.tl-row:last-child::before{bottom:calc(100% - 16px)}
.tl-row .dot{position:absolute; left:93px; top:15px; width:7px; height:7px; border-radius:50%; background:var(--accent); border:2px solid var(--bg)}
.tl-row .tm{font-family:"DM Mono",monospace; font-size:12.5px; color:var(--ink-2); font-variant-numeric:tabular-nums; text-align:right; padding-top:1px}
.tl-row .bdy{padding-left:16px}

/* Absprachen */
.thread{display:flex; flex-direction:column; gap:14px; padding:16px; max-height:52vh; overflow-y:auto}
.bubble{max-width:min(560px,88%); display:flex; flex-direction:column; gap:4px}
.bubble .who{font-size:11px; color:var(--ink-3)}
.bubble .who b{font-weight:500; color:var(--ink-2)}
.bubble .txt{border:1px solid var(--line); background:var(--surface); border-radius:2px 9px 9px 9px; padding:9px 12px; white-space:pre-wrap; font-size:13.5px}
.bubble.self{align-self:flex-end; align-items:flex-end}
.bubble.self .txt{background:var(--accent-tint); border-color:transparent; border-radius:9px 2px 9px 9px}
.composer{border-top:1px solid var(--line); padding:12px 16px; display:flex; gap:10px; align-items:flex-end}

/* ============================================================
   Anmeldung
   ============================================================ */
.entrance{min-height:100vh; display:grid; grid-template-columns:1.1fr .9fr}
@media (max-width:900px){.entrance{grid-template-columns:1fr}}
.entrance .left{
  padding:56px 6vw; display:flex; flex-direction:column; justify-content:center; gap:26px;
  border-right:1px solid var(--line); background:var(--surface);
}
@media (max-width:900px){.entrance .left{border-right:none; border-bottom:1px solid var(--line); padding:40px 24px}}
.entrance h1{font-family:"Source Serif 4",Georgia,serif; font-size:clamp(30px,3.8vw,46px); line-height:1.08; letter-spacing:-.025em; font-weight:600}
.entrance .lead{font-size:16px; line-height:1.62; color:var(--ink-2); max-width:44ch}
.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.facts div{background:var(--surface); padding:13px 14px}
.facts b{display:block; font-size:19px; font-weight:600; letter-spacing:-.02em; margin-bottom:2px}
.facts span{font-size:12px; color:var(--ink-3); line-height:1.35; display:block}
.entrance .right{padding:48px 6vw; display:flex; flex-direction:column; justify-content:center; gap:18px}
@media (max-width:900px){.entrance .right{padding:32px 24px 56px}}
.seg{display:flex; border:1px solid var(--line-2); border-radius:var(--r-sm); overflow:hidden; background:var(--sunken)}
.seg button{flex:1; background:transparent; border:none; padding:8px; cursor:pointer; font-size:12.5px; font-weight:500; color:var(--ink-3)}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-1)}
.codefield{
  font-family:"DM Mono",monospace; font-size:24px; letter-spacing:.34em; text-align:center;
  text-transform:uppercase; padding:14px 8px 14px 16px;
}

/* Sonstiges */

  useEffect(function () {
    sb.auth.getSession().then(function (r) { setSession(r.data.session); setReady(true); });
    var sub = sb.auth.onAuthStateChange(function (_e, s) { setSession(s); });
    return function () { sub.data.subscription.unsubscribe(); };
  }, []);

  function leave() { location.hash = ""; setModel(null); }

  var view;
  if (!ready) view = div({ style: { display: "grid", placeItems: "center", minHeight: "100vh" } }, span({ className: "spin" }));
  else if (model) view = h(ModelApp, { code: model.code, initial: model.data, toast: toast, onLeave: leave });
  else if (session) view = h(AdminApp, { session: session, toast: toast });
  else view = h(Entrance, { onModel: function (code, data) { setModel({ code: code, data: data }); }, toast: toast });

  return h(Frag, null, view, Toast({ msg: msg }));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));

})();
</script>

</body>
</html>
